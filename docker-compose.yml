services:
  quality-gate-encoder:
    image: drumsergio/quality-gate-encoder:1.5.12
    container_name: quality-gate-encoder
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /source:/app/source        # read-write: the " - 720p" links go here
      - /dest:/app/destination
    environment:
      ENABLE_HW_ACCEL: "true"
      HW_ENCODING_TYPE: "intel"
      ENCODING_QUALITY: "LOW"
      SOURCE_FOLDER: "/app/source"
      DEST_FOLDER: "/app/destination"
      ENCODING_CODEC: "hevc"
      POLL_INTERVAL: "60"   # seconds between scans of the source tree
      SYMLINK_TARGET_PREFIX: "/dest"  # the destination as Jellyfin sees it; needed for the Version menu
    restart: always
    # For NVIDIA GPU support, uncomment below:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]
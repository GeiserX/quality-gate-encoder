# mkdocs.yml for GeiserX/quality-gate-encoder. The docs/ contract this file assumes is in
# new-repo/README-STANDARD.md; the site is built and published by .github/workflows/docs.yml.
site_name: quality-gate-encoder
site_url: https://geiserx.github.io/quality-gate-encoder/
site_description: Your whole Jellyfin library, also in 720p. A Docker container that adds a 720p copy beside every film and episode, so phones and remote viewers direct play instead of making the server transcode.
repo_url: https://github.com/GeiserX/quality-gate-encoder
repo_name: GeiserX/quality-gate-encoder
edit_uri: edit/main/docs/

# A warning is a broken link, a missing page or a page nobody can reach. All of
# them fail the build, locally and in CI, so nobody has to remember --strict.
strict: true

theme:
  name: material
  language: en
  logo: images/logo.svg
  favicon: images/icon.svg
  # Dark first: the first palette entry is the default, and the banner is dark.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

# MkDocs reports most link problems as `info`, which --strict ignores. Every
# line here promotes one of them to a warning so the build fails on it:
#   nav.omitted_files   a Markdown file under docs/ that is in no nav entry and
#                       not in exclude_docs (a page nobody can reach, published
#                       at a public URL anyway);
#   nav.not_found       a nav entry whose file does not exist;
#   links.not_found     a relative link to a page or file that does not exist;
#   links.anchors       a link to a heading that does not exist;
#   links.absolute_links  a link written as /path/ (breaks under the
#                       /quality-gate-encoder/ prefix of the site);
#   links.unrecognized_links  a relative link that leaves docs/ (../README.md).
#                       Repo files are linked by absolute GitHub URL instead.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

plugins:
  - search
  # When a page is renamed, keep the old URL alive: add `mkdocs-redirects==1.2.2`
  # to docs/requirements-docs.txt and uncomment. No page has been renamed yet.
  # - redirects:
  #     redirect_maps:
  #       old-name.md: new-name.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # base_path includes the repository root, so a page can include a file that
  # ships (docker-compose.yml) word for word with `--8<-- "docker-compose.yml"`.
  # check_paths makes a missing include fail the build instead of rendering an
  # empty block. No page includes a repo file today; add the file to the docs
  # workflow's push paths when one does.
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.mark
  - attr_list
  - md_in_html
  # Renders :material-xxx: shortcodes as icons. The grid cards on index.md use
  # them; without this they print as literal text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GeiserX/quality-gate-encoder
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/drumsergio/quality-gate-encoder

extra_css:
  - stylesheets/theme.css

# Files under docs/ that are not pages. MkDocs publishes every Markdown file in
# docs/ whether or not it is in the nav, so anything that is not a page must be
# listed here. The patterns follow the docs/ contract: a page is a lowercase
# kebab-case .md file; anything with a capital letter (ROADMAP.md, CHANGELOG.md)
# is a repo-facing note, and design/, research/ and notes/ hold material read
# on GitHub. None of these exists in this repo today; the patterns guard the
# next one.
exclude_docs: |
  [A-Z]*.md
  design/
  research/
  notes/
  requirements-docs.txt

# Grouped tabs (the kit: a repo with fewer than eight pages still groups, and a
# tab with one page is a smell). The nav title equals each page's H1.
nav:
  - Home: index.md
  - Get started:
      - Getting started: getting-started.md
      - Cross-host manifest mode: cross-host.md
  - Reference:
      - Configuration: configuration.md
      - How it works: how-it-works.md
      - Safety and cleanup: safety.md
      - Utilities: utilities.md
  - Development:
      - Development: development.md
      - Related projects: related.md
